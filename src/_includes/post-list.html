{%- assign years = posts | byYear -%}
<ul class="posts">
{%- for group in years %}
  {%- for post in group.items %}
  <li>
    <span class="posts__year">{% if forloop.first %}{{ group.year }}{% endif %}</span>
    <span>
      <a href="{{ post.url }}">{{ post.data.title }}</a>
      {%- if post.data.lang == 'nl' %} <span class="muted">(Dutch)</span>{% endif %}
    </span>
  </li>
  {%- endfor %}
{%- endfor %}
</ul>
