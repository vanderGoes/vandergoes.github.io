name: Import Tumblr images

# One-off: downloads every image listed in scripts/tumblr-images.tsv from
# Tumblr's CDN into assets/img/posts/ and commits them, so the site no longer
# depends on Tumblr. Safe to re-run; files that already exist are skipped.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/tumblr-images.tsv]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: bash scripts/import-tumblr-images.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/img/posts
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Import post images from Tumblr"
            git push
          fi
